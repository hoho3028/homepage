<html>
  <head>
    <style>
/* body {display: flex;align-items: center;justify-content: space-around;min-height: 100vh;margin: 0;overflow: hidden;} */
    .box {display: block;width:100%;height:500px;border-radius:12px;position: relative;}
    .green{opacity:1;}
    .red{position: absolute;top:0;left:0;opacity:0;}
    </style>
  </head>
  <body>
    <div class="box">
      <img src="img/before.jpg" class="green">
      <img src="img/after.jpg" class="red">
    </div>
    <div class="box red"></div>
  </body>
</html>
<script src="js/gsap.min.js"></script>
<script>
  gsap.to(".green", { 
  duration: 5,
  delay: 0,
  opacity:0,
});
  gsap.to(".red", { 
  duration: 5,
  delay: 0,
  opacity:1,
});
</script>
