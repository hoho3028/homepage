  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    const targetText2 = "Wecome to my home";
    const alphabet2 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const element2 = document.getElementById("animatedText2");

    // 애니메이션 실행
    anime({
      targets: { progress: 0 }, // 초기 상태
      progress: 1, // 최종 상태
      duration: 5000, // 전체 애니메이션 시간 (5초)
      easing: 'linear',
      update: function (anim) {
        const progress = Math.floor(anim.animations[0].currentValue * targetText2.length);
        element2.textContent = Array.from(targetText2).map((char, index) => {
          if (index < progress) return targetText2[index];
          const randomIndex = Math.floor(Math.random() * alphabet2.length);
          return alphabet2[randomIndex];
        }).join('');
      }
    });
  </script>
     <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script>
