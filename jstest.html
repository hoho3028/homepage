<html lang="ko">
  <head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
/* body {display: flex;align-items: center;justify-content: space-around;min-height: 100vh;margin: 0;overflow: hidden;} */
    .box {display: block;width:100%;height:500px;border-radius:12px;position: relative;}
    .green{opacity:1;}
    .red{position: absolute;top:0;left:0;opacity:0;}
    .text {font-size: 3rem;font-weight: bold;letter-spacing: 0.1em;}
    button {padding: 10px 20px;font-size: 1rem;margin: 0.5rem;cursor: pointer;}
    </style>
  </head>
  <body>
    
    <div class="box">
      <img src="img/before.jpg" class="green">
      <img src="img/after.jpg" class="red">
    </div>
    <div>
    <button onclick="startDefaultAnimation()">기본 JS 애니메이션</button>
    <button onclick="startAnimeAnimation()">anime.js 애니메이션</button>
    <button onclick="startTypedAnimation()">Typed.js 애니메이션</button>
  </div>
  <div>
    <h4>알파벳 순서 애니메이션 1(일반 스크립트제작)</h4>
      <div class="text" id="defaultText">Wecome to my home</div>
      
  </div>
  <div>
    <h4>알파벳 순서 애니메이션 2(anime.js 구현)</h4>
    <div class="text" id="animeText">Wecome to my home</div>
    
  </div>
  <div>
    <h4>알파벳 순서 애니메이션 3(Typed.js 구현)</h4>
    <div id="typedText"></div>
  </div>
  <script src="js/gsap.min.js"></script>
<script>
  gsap.to(".green", { 
  duration: 5,
  delay: 0,
  opacity:0,
});
  gsap.to(".red", { 
  duration: 5,
  delay: 0,
  opacity:1,
});
</script>
 <script>
    // 기본 JS 애니메이션
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const defaultTarget = "Wecome to my home";
    const defaultTextElement = document.getElementById("defaultText");

    function startDefaultAnimation() {
      let currentIndexes = Array.from(defaultTextElement.textContent).map(char => alphabet.indexOf(char));
      const targetIndexes = Array.from(defaultTarget).map(char => alphabet.indexOf(char));
      const speed = 200;

      function animate() {
        let done = true;
        currentIndexes = currentIndexes.map((currentIndex, i) => {
          if (currentIndex !== targetIndexes[i]) {
            done = false;
            currentIndex = (currentIndex + 1) % alphabet.length;
          }
          return currentIndex;
        });

        defaultTextElement.textContent = currentIndexes.map(index => alphabet[index]).join("");

        if (!done) {
          setTimeout(animate, speed);
        }
      }
      animate();
    }
  </script>

  <!-- anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    const animeTarget = "Wecome to my home";
    const animeTextElement = document.getElementById("animeText");

    function startAnimeAnimation() {
      anime({
        targets: { progress: 0 },
        progress: 1,
        duration: 5000,
        easing: "linear",
        update: function (anim) {
          const progress = Math.floor(anim.animations[0].currentValue * animeTarget.length);
          animeTextElement.textContent = Array.from(animeTarget).map((char, index) => {
            if (index < progress) return animeTarget[index];
            const randomIndex = Math.floor(Math.random() * alphabet.length);
            return alphabet[randomIndex];
          }).join('');
        }
      });
    }
  </script>

  <!-- Typed.js -->
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script>
    function startTypedAnimation() {
      new Typed('#typedText', {
        strings: ['Wecome to my home', 'HELLO'],
        typeSpeed: 100,
        backSpeed: 50,
        loop: false,
        showCursor: false
      });
    }
  </script>
  </body>
</html>
