<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP 슬라이드 원페이지</title>
<!--     <link rel="stylesheet" href="style.css"> -->
  <style>
    #top-gnb {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background-color: #333;
  z-index: 1000;
}

#top-gnb ul {
  display: flex;
  justify-content: space-around;
  list-style-type: none;
  padding: 10px 0;
}

#top-gnb a {
  color: white;
  text-decoration: none;
}


      body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
          background-color:#000;
}
body {
  -ms-overflow-style: none;  /* IE, Edge */
  scrollbar-width: none;  /* Firefox */
}

body::-webkit-scrollbar {
  display: none;  /* Chrome, Safari, Opera */
}
.container {
    height: 100vh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
}

.slide {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    scroll-snap-align: start;
}

.nav-container {
  position: fixed;
  top: 50%;
  right: 20px;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  list-style-type: none;
}

.nav-item {
  margin: 10px 0;
}

.nav-item a {
  display: block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: #ccc;
  transition: background-color 0.3s;
}

.nav-item a.active {
  background-color: #333;
}

#slide1 { background-image: url('img/main/main_bg1.jpg');}
#slide2 { background-image: url('img/main/main_bg2.jpg'); }
#slide3 { background-image: url('img/main/main_bg3.jpg'); }
#slide4 { background-image: url('img/main/main_bg4.jpg'); }
#slide5 { background-image: url('img/main/main_bg5.jpg'); }
#slide6 { background-color: #000; }


  </style>
</head>
<body>
    <nav id="top-gnb">
  <ul>
    <li><a href="#section1">Section 1</a></li>
    <li><a href="#section2">Section 2</a></li>
    <li><a href="#section3">Section 3</a></li>
  </ul>
</nav>

<div class="container">
        <section class="slide" id="slide1">
            <h1>슬라이드 1</h1>
        </section>
        <section class="slide" id="slide2">
            <h1>슬라이드 2</h1>
        </section>
        <section class="slide" id="slide3">
            <h1>슬라이드 3</h1>
        </section>
    <section class="slide" id="slide4">
            <h1>슬라이드 4</h1>
        </section>
    <section class="slide" id="slide5">
            <h1>슬라이드 5</h1>
        </section>
    <section class="slide" id="slide6">
            <h1>슬라이드 6</h1>
        </section>
    </div>
    <nav>
  <ul class="nav-container">
    <li class="nav-item"><a href="#slide1"></a></li>
    <li class="nav-item"><a href="#slide2"></a></li>
    <li class="nav-item"><a href="#slide3"></a></li>
      <li class="nav-item"><a href="#slide4"></a></li>
      <li class="nav-item"><a href="#slide5"></a></li>
      <li class="nav-item"><a href="#slide6"></a></li>
  </ul>
</nav>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollToPlugin.min.js"></script>
    <script>


// 원페이지 슬라이드 설정
gsap.utils.toArray(".sections section").forEach((section, i) => {
  ScrollTrigger.create({
    trigger: section,
    start: "top top",
    pin: true,
    pinSpacing: false
  });
});


// 슬라이드 요소 선택
const slides = document.querySelectorAll('.slide');

// GSAP 타임라인 생성
const tl = gsap.timeline({
    scrollTrigger: {
        trigger: ".container",
        pin: true,
        scrub: 1,
        snap: 1 / (slides.length - 1),
        start: "top top",
        end: "+=3000"
    }
});

// 각 슬라이드에 애니메이션 추가
slides.forEach((slide, i) => {
    if (i !== 0) {
        tl.from(slide, {yPercent: 100, opacity: 0, duration: 1});
    }
    
    if (i !== slides.length - 1) {
        tl.to({}, {duration: 1}); // 각 슬라이드 사이에 지연 추가
    }
});

const sections = document.querySelectorAll('.slide');
const navItems = document.querySelectorAll('.nav-item a');

window.addEventListener('scroll', () => {
  let current = '';
  sections.forEach(section => {
    const sectionTop = section.offsetTop;
    const sectionHeight = section.clientHeight;
    if (pageYOffset >= sectionTop - sectionHeight / 3) {
      current = section.getAttribute('id');
    }
  });

  navItems.forEach(item => {
    item.classList.remove('active');
    if (item.getAttribute('href').slice(1) === current) {
      item.classList.add('active');
    }
  });
});


    </script>
</body>
</html>
