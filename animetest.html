<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP 슬라이드 원페이지</title>
<!--     <link rel="stylesheet" href="style.css"> -->
  <style>
    #top-gnb {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background-color: #333;
  z-index: 1000;
}

#top-gnb ul {
  display: flex;
  justify-content: space-around;
  list-style-type: none;
  padding: 10px 0;
}

#top-gnb a {
  color: white;
  text-decoration: none;
}

.sections section {
  height: 100vh;
}
  </style>
</head>
<body>
    <nav id="top-gnb">
  <ul>
    <li><a href="#section1">Section 1</a></li>
    <li><a href="#section2">Section 2</a></li>
    <li><a href="#section3">Section 3</a></li>
  </ul>
</nav>

<div class="sections">
  <section id="section1">Section 1 Content</section>
  <section id="section2">Section 2 Content</section>
  <section id="section3">Section 3 Content</section>
</div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollToPlugin.min.js"></script>
    <script>
    gsap.registerPlugin(ScrollTrigger);

// 원페이지 슬라이드 설정
gsap.utils.toArray(".sections section").forEach((section, i) => {
  ScrollTrigger.create({
    trigger: section,
    start: "top top",
    pin: true,
    pinSpacing: false
  });
});

// GNB 스크롤 애니메이션
gsap.to("#top-gnb", {
  scrollTrigger: {
    trigger: "body",
    start: "top top",
    end: "bottom bottom",
    toggleActions: "play none none reverse"
  },
  y: 0,
  opacity: 1,
  duration: 0.3
});

    </script>
</body>
</html>
