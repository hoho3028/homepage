<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탭 버튼 예제</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .tab {
            display: inline-block;
            padding: 10px 20px;
            cursor: pointer;
            border: 1px solid #ccc;
            margin-right: 5px;
            transition: background-color 0.3s;
        }
        .tab.active {
            background-color: #ddd;
        }
        .content {
            display: none;
            margin-top: 10px;
            border: 1px solid #ccc;
            padding: 20px;
        }
        .content.active {
            display: block;
        }
        .icon {
            margin-left: 5px;
        }
    </style>
</head>
<body>

<div>
    <div class="tab" data-target="content1">
        탭 1 <i class="fa-solid fa-angle-down icon"></i>
    </div>
    <div class="tab" data-target="content2">
        탭 2 <i class="fa-solid fa-angle-down icon"></i>
    </div>
</div>

<div id="content1" class="content">
    <h2>탭 1의 내용</h2>
    <p>이곳은 탭 1의 내용이 표시되는 영역입니다.</p>
</div>

<div id="content2" class="content">
    <h2>탭 2의 내용</h2>
    <p>이곳은 탭 2의 내용이 표시되는 영역입니다.</p>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const targetContent = document.getElementById(targetId);

                // 현재 클릭된 탭이 이미 활성화된 상태인지 확인
                const isActive = this.classList.contains('active');

                // 모든 탭, 콘텐츠 및 아이콘 상태 초기화
                tabs.forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
                document.querySelectorAll('.icon').forEach(icon => {
                    icon.classList.remove('fa-angle-up');
                    icon.classList.add('fa-angle-down');
                });

                if (!isActive) {
                    // 선택된 탭과 콘텐츠 활성화 및 아이콘 변경
                    this.classList.add('active');
                    targetContent.classList.add('active');
                    this.querySelector('.icon').classList.remove('fa-angle-down');
                    this.querySelector('.icon').classList.add('fa-angle-up');
                }
            });
        });

        // 기본적으로 첫 번째 탭과 콘텐츠를 활성화
        if (tabs.length > 0) {
            tabs[0].click();
        }
    });
</script>

</body>
</html>
