<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원페이지 스크롤 페이지</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      scroll-snap-align: start;
    }

    .section-1 { background-image: url('img/main/main_bg1.jpg'); }
    .section-2 { background-image: url('img/main/main_bg2.jpg'); }
    .section-3 { background-image: url('img/main/main_bg3.jpg'); }
    .section-4 { background-image: url('img/main/main_bg4.jpg'); }
    .section-5 { background-image: url('img/main/main_bg5.jpg'); }
    .section-6 { background-color: #000; }

    #top-gnb {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #333;
      z-index: 1000;
    }

    #top-gnb ul {
      display: flex;
      justify-content: space-between;
      list-style-type: none;
      padding: 10px 50px;
    }

    #top-gnb a {
      color: white;
      text-decoration: none;
    }

    .content h1 {
      font-size: 3rem;
      color: white;
      text-align: center;
    }

    .nav-container {
      position: fixed;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      list-style-type: none;
    }

    .nav-item {
      margin: 10px 0;
    }

    .nav-item a {
      display: block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ccc;
      transition: background-color 0.3s, transform 0.3s;
    }

    .nav-item a.active {
      background-color: #ff4500;
      transform: scale(1.3);
    }
  </style>
</head>
<body>
  <nav id="top-gnb">
    <ul>
      <li class="logo"><a href="#section-1">logo</a></li>
      <li class="topmenu"><a href="#section-2">메뉴</a></li>
    </ul>
  </nav>

  <section class="section section-1" id="section-1">
    <div class="content">
      <h1>첫 번째 섹션</h1>
    </div>
  </section>
  <section class="section section-2" id="section-2">
    <div class="content">
      <h1>두 번째 섹션</h1>
    </div>
  </section>
  <section class="section section-3" id="section-3">
    <div class="content">
      <h1>세 번째 섹션</h1>
    </div>
  </section>
  <section class="section section-4" id="section-4">
    <div class="content">
      <h1>네 번째 섹션</h1>
    </div>
  </section>
  <section class="section section-5" id="section-5">
    <div class="content">
      <h1>다섯 번째 섹션</h1>
    </div>
  </section>
  <section class="section section-6" id="section-6">
    <div class="content">
      <h1>여섯 번째 섹션</h1>
    </div>
  </section>

  <nav>
    <ul class="nav-container">
      <li class="nav-item"><a href="#section-1"></a></li>
      <li class="nav-item"><a href="#section-2"></a></li>
      <li class="nav-item"><a href="#section-3"></a></li>
      <li class="nav-item"><a href="#section-4"></a></li>
      <li class="nav-item"><a href="#section-5"></a></li>
      <li class="nav-item"><a href="#section-6"></a></li>
    </ul>
  </nav>

  <script>
    let currentSectionIndex = 0;
    let isScrolling = false;
    const sections = document.querySelectorAll('.section');
    const navLinks = document.querySelectorAll('.nav-item a');

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (isScrolling) return;
      isScrolling = true;

      if (e.deltaY > 0) {
        navigateToNextSection();
      } else {
        navigateToPreviousSection();
      }

      setTimeout(() => isScrolling = false, 800);
    }, { passive: false });

    navLinks.forEach((link, index) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        currentSectionIndex = index;
        scrollToSection(index);
      });
    });

    function navigateToNextSection() {
      if (currentSectionIndex < sections.length - 1) {
        currentSectionIndex++;
        scrollToSection(currentSectionIndex);
      }
    }

    function navigateToPreviousSection() {
      if (currentSectionIndex > 0) {
        currentSectionIndex--;
        scrollToSection(currentSectionIndex);
      }
    }

    function scrollToSection(index) {
      sections[index].scrollIntoView({ behavior: 'smooth' });
      updateActiveNav();
    }

    function updateActiveNav() {
      navLinks.forEach((link, index) => {
        link.classList.toggle('active', index === currentSectionIndex);
      });
    }
  </script>
</body>
</html>
