<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원페이지 스크롤 페이지</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    section {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background-repeat: no-repeat;
    background-size: cover;
          scroll-snap-align: start;
      
    }

    .section-1 { background: #1abc9c; }
    .section-2 { background: #3498db; }
    .section-3 { background: #9b59b6; }
    .section-4 { background: #e74c3c; }
    .section-5 { background: #f1c40f; }
    .section-6 { background: #34495e; }

    #top-gnb {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #333;
      z-index: 1000;
    }

    #top-gnb ul {
      display: flex;
      justify-content: space-between;
      list-style: none;
      padding: 10px 50px;
    }

    #top-gnb a {
      color: white;
      text-decoration: none;
    }

    .content h1 {
      font-size: 3rem;
      color: white;
      text-align: center;
    }

    .nav-container {
      position: fixed;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-item a {
      display: block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #ccc;
      transition: background-color 0.3s;
    }

    .nav-item a.active {
      background-color: #333;
    }
  </style>
</head>
<body>
  <nav id="top-gnb">
    <ul>
      <li class="logo"><a href="#section-1">Logo</a></li>
      <li class="topmenu"><a href="#section-2">메뉴</a></li>
    </ul>
  </nav>

  <!-- 섹션 목록 -->
  <section class="section section-1" id="section-1">
    <div class="content"><h1>첫 번째 섹션</h1></div>
  </section>
  <section class="section section-2" id="section-2">
    <div class="content"><h1>두 번째 섹션</h1></div>
  </section>
  <section class="section section-3" id="section-3">
    <div class="content"><h1>세 번째 섹션</h1></div>
  </section>
  <section class="section section-4" id="section-4">
    <div class="content"><h1>네 번째 섹션</h1></div>
  </section>
  <section class="section section-5" id="section-5">
    <div class="content"><h1>다섯 번째 섹션</h1></div>
  </section>
  <section class="section section-6" id="section-6">
    <div class="content"><h1>여섯 번째 섹션</h1></div>
  </section>

  <!-- 네비게이션 -->
  <nav>
    <ul class="nav-container">
      <li class="nav-item"><a href="#section-1"></a></li>
      <li class="nav-item"><a href="#section-2"></a></li>
      <li class="nav-item"><a href="#section-3"></a></li>
      <li class="nav-item"><a href="#section-4"></a></li>
      <li class="nav-item"><a href="#section-5"></a></li>
      <li class="nav-item"><a href="#section-6"></a></li>
    </ul>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    const sections = document.querySelectorAll('.section');
    const navLinks = document.querySelectorAll('.nav-item a');
    let currentSectionIndex = 0;
    let isScrolling = false;

    window.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (isScrolling) return;
      isScrolling = true;

      if (e.deltaY > 0 && currentSectionIndex < sections.length - 1) {
        currentSectionIndex++;
      } else if (e.deltaY < 0 && currentSectionIndex > 0) {
        currentSectionIndex--;
      }

      scrollToSection(currentSectionIndex);
      setTimeout(() => isScrolling = false, 800);
    }, { passive: false });

    navLinks.forEach((link, index) => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        currentSectionIndex = index;
        scrollToSection(index);
      });
    });

    function scrollToSection(index) {
      sections[index].scrollIntoView({ behavior: 'smooth' });
      updateNav(index);
      animateText(sections[index].querySelector('h1'));
    }

    function updateNav(index) {
      navLinks.forEach(link => link.classList.remove('active'));
      navLinks[index].classList.add('active');
    }

    function animateText(element) {
      const originalText = element.textContent;
      const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

      anime({
        targets: element,
        textContent: () => {
          return Array.from(originalText).map(() => characters[Math.floor(Math.random() * characters.length)]).join('');
        },
        easing: 'easeInOutQuad',
        duration: 500,
        complete: () => {
          element.textContent = originalText;
        }
      });
    }

    // 초기 활성화 설정
    updateNav(currentSectionIndex);
    animateText(sections[currentSectionIndex].querySelector('h1'));
  </script>
</body>
</html>
