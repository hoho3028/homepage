<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원페이지 스크롤 페이지</title>
  <link rel="stylesheet" href="css/style.css">
</head>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body, html {
  height: 100%;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  scroll-snap-align: start;
}

.section-1 {
   background-image: url('img/main/main_bg1.jpg');
}

.section-2 {
   background-image: url('img/main/main_bg2.jpg');
}

.section-3 {
  background-image: url('img/main/main_bg3.jpg'); 
}

.section-4 {
  background-image: url('img/main/main_bg4.jpg'); 
}
.section-5 {
  background-image: url('img/main/main_bg5.jpg'); 
}
.section-6 {
  background-color: #000; 
}
 #top-gnb {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background-color: #333;
  z-index: 1000;
}

#top-gnb ul {
  display: flex;
  justify-content: space-between;
  list-style-type: none;
  padding: 10px 50px;
}
#top-gnb li.logo {}
#top-gnb li.topmenu {}
	  
#top-gnb a {
  color: white;
  text-decoration: none;
}

.content h1 {
  font-size: 3rem;
  color: white;
  text-align: center;
}
#animeText {
      font-size: 40px;
      font-weight: bold;
      white-space: pre-wrap; /* 줄바꿈을 유지 */
      line-height: 1.5;
    }
.nav-container {
  position: fixed;
  top: 50%;
  right: 20px;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  list-style-type: none;
}

.nav-item {
  margin: 10px 0;
}

.nav-item a {
  display: block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: #ccc;
  transition: background-color 0.3s;
}

.nav-item a.active {
  background-color: #333;
}

#text-container {
            font-size: 24px;
            line-height: 1.5;
        }
        .highlight {
            color: #ff4500;
            font-weight: bold;
        }
  </style>
<body>
	<nav id="top-gnb">
  <ul>
    <li class="logo"><a href="#section1">logo</a></li>
    <li class="topmenu"><a href="#section2">메뉴</a></li>
  </ul>
</nav>
  <section class="section section-1">
    <div class="content">
      <h1>첫 번째 섹션</h1>
	     <div id="text-container"></div>
	  <div id="animeText" style="font-size: 40px; font-weight: bold;"></div>
    </div>
  </section>

  <section class="section section-2">
    <div class="content">
      <h1>두 번째 섹션</h1>
    </div>
  </section>

  <section class="section section-3">
    <div class="content">
      <h1>세 번째 섹션</h1>
    </div>
  </section>

  <section class="section section-4">
    <div class="content">
      <h1>네 번째 섹션</h1>
    </div>
  </section>
<section class="section section-5">
    <div class="content">
      <h1>다섯 번째 섹션</h1>
    </div>
  </section>
	<section class="section section-6">
    <div class="content">
      <h1>여섯 번째 섹션</h1>
    </div>
  </section>
<nav>
  <ul class="nav-container">
    <li class="nav-item"><a href="#section-1"></a></li>
    <li class="nav-item"><a href="#section-2"></a></li>
    <li class="nav-item"><a href="#section-3"></a></li>
      <li class="nav-item"><a href="#section-4"></a></li>
      <li class="nav-item"><a href="#section-5"></a></li>
      <li class="nav-item"><a href="#section-6"></a></li>
  </ul>
</nav>
  <script>
    // 모든 섹션을 선택
const sections = document.querySelectorAll('.section');

// 섹션이 변경될 때마다 부드럽게 이동하는 이벤트 리스너 추가
window.addEventListener('wheel', (e) => {
  if (e.deltaY > 0) {
    // 아래로 스크롤: 다음 섹션으로 이동
    navigateToNextSection();
  } else {
    // 위로 스크롤: 이전 섹션으로 이동
    navigateToPreviousSection();
  }
});

let currentSectionIndex = 0;

// 섹션 이동 함수
function navigateToNextSection() {
  if (currentSectionIndex < sections.length - 1) {
    currentSectionIndex++;
    scrollToSection(currentSectionIndex);
  }
}

function navigateToPreviousSection() {
  if (currentSectionIndex > 0) {
    currentSectionIndex--;
    scrollToSection(currentSectionIndex);
  }
}

// 특정 섹션으로 부드럽게 스크롤
function scrollToSection(index) {
  const section = sections[index];
  section.scrollIntoView({ behavior: 'smooth' });
}


const texts = [
            "The quick brown fox",
            "jumps over the lazy dog",
            "and runs away happily"
        ];

        const highlightWords = ["quick", "lazy", "happily"];

        const textContainer = document.getElementById('text-container');

        // 텍스트를 span으로 감싸고 하이라이트 적용
        texts.forEach(text => {
            const line = document.createElement('div');
            const words = text.split(' ');
            words.forEach(word => {
                const span = document.createElement('span');
                span.innerHTML = word + ' ';
                if (highlightWords.includes(word)) {
                    span.classList.add('highlight');
                }
                line.appendChild(span);
            });
            textContainer.appendChild(line);
        });

        const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

        function animateLine(lineElement, delay) {
            anime.timeline({loop: false})
                .add({
                    targets: lineElement.querySelectorAll('span'),
                    innerHTML: function() {
                        return characters[anime.random(0, characters.length - 1)];
                    },
                    easing: 'easeInOutQuad',
                    duration: 500,
                    delay: anime.stagger(50),
                    loop: true
                }, delay)
                .add({
                    targets: lineElement.querySelectorAll('span'),
                    innerHTML: function(el) {
                        return el.dataset.originalText;
                    },
                    easing: 'easeInOutQuad',
                    duration: 500,
                    delay: anime.stagger(50)
                }, delay + 1000);
        }

        // 각 줄에 대해 애니메이션 적용
        textContainer.querySelectorAll('div').forEach((line, index) => {
            line.querySelectorAll('span').forEach(span => {
                span.dataset.originalText = span.innerText;
            });
            animateLine(line, index * 1500);
        });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/animejs/lib/anime.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</body>
</html>
