<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원페이지 스크롤 페이지</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    section {
      height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      scroll-snap-align: start;
      padding:0 50px;
    }

    .section-1 { background-image: url('img/main/main_bg1.jpg');justify-content: flex-start;}
    .section-2 { background-image: url('img/main/main_bg2.jpg');justify-content: flex-end; }
    .section-3 { background-image: url('img/main/main_bg3.jpg');justify-content: flex-start; }
    .section-4 { background-image: url('img/main/main_bg4.jpg');justify-content: flex-end; }
    .section-5 { background-image: url('img/main/main_bg5.jpg'); }
    .section-6 { background-color: #000; }

    #top-gnb {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background-color: #333;
      z-index: 1000;
    }

    #top-gnb ul {
      display: flex;
      justify-content: space-between;
      list-style-type: none;
      padding: 10px 50px;
    }

    #top-gnb a {
      color: white;
      text-decoration: none;
    }

    .content h1 {
      font-size: 3rem;
      color: white;
      text-align: center;
    }

    .nav-container {
      position: fixed;
      top: 50%;
      right: 20px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      list-style-type: none;
    }

    .nav-item {
      margin: 10px 0;
    }

    .nav-item a {
      display: block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ccc;
      transition: background-color 0.3s;
    }

    .nav-item a.active {
      background-color: #333;
    }
  </style>
</head>
<body>
  <nav id="top-gnb">
    <ul>
      <li class="logo"><a href="#section-1">logo</a></li>
      <li class="topmenu"><a href="#section-2">메뉴</a></li>
    </ul>
  </nav>

  <section class="section section-1" id="section-1">
    <div class="content">
      <h1 data-text="Your Brand's Journey<br>Transforming"></h1>
    </div>
  </section>

  <section class="section section-2" id="section-2">
    <div class="content">
      <h1 data-text="두 번째 섹션">두 번째 섹션</h1>
    </div>
  </section>

  <section class="section section-3" id="section-3">
    <div class="content">
      <h1 data-text="세 번째 섹션">세 번째 섹션</h1>
    </div>
  </section>

  <section class="section section-4" id="section-4">
    <div class="content">
      <h1 data-text="네 번째 섹션">네 번째 섹션</h1>
    </div>
  </section>

  <section class="section section-5" id="section-5">
    <div class="content">
      <h1 data-text="다섯 번째 섹션">다섯 번째 섹션</h1>
    </div>
  </section>

  <section class="section section-6" id="section-6">
    <div class="content">
      <h1 data-text="여섯 번째 섹션">여섯 번째 섹션</h1>
    </div>
  </section>

  <nav>
    <ul class="nav-container">
      <li class="nav-item"><a href="#section-1" class="active"></a></li>
      <li class="nav-item"><a href="#section-2"></a></li>
      <li class="nav-item"><a href="#section-3"></a></li>
      <li class="nav-item"><a href="#section-4"></a></li>
      <li class="nav-item"><a href="#section-5"></a></li>
      <li class="nav-item"><a href="#section-6"></a></li>
    </ul>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    // 섹션과 내비게이션 요소 선택
const sections = document.querySelectorAll('.section');
const navLinks = document.querySelectorAll('.nav-item a');
let currentSectionIndex = 0;
let isScrolling = false;

// 스크롤 이벤트 리스너
window.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (isScrolling) return;
  isScrolling = true;

  if (e.deltaY > 0 && currentSectionIndex < sections.length - 1) {
    currentSectionIndex++;
  } else if (e.deltaY < 0 && currentSectionIndex > 0) {
    currentSectionIndex--;
  }

  scrollToSection(currentSectionIndex);
  setTimeout(() => isScrolling = false, 800);
}, { passive: false });

// 내비게이션 클릭 이벤트
navLinks.forEach((link, index) => {
  link.addEventListener('click', (e) => {
    e.preventDefault();
    currentSectionIndex = index;
    scrollToSection(index);
  });
});

// 스크롤 시 섹션 이동 및 애니메이션 적용
function scrollToSection(index) {
  sections[index].scrollIntoView({ behavior: 'smooth' });
  updateNav(index);
}

// 내비게이션 상태 업데이트
function updateNav(index) {
  navLinks.forEach(link => link.classList.remove('active'));
  navLinks[index].classList.add('active');
}

// 텍스트 애니메이션 함수
function animateText(element) {
  const originalText = element.dataset.text;
  const lines = originalText.split('<br>');
  const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

  let lineIndex = 0;
  let charIndex = 0;
  const interval = setInterval(() => {
    const currentLine = lines[lineIndex];
    element.innerHTML = lines
      .map((line, i) => {
        if (i < lineIndex) return line;
        if (i === lineIndex) {
          return line.split('')
            .map((char, j) => j < charIndex ? char : characters[Math.floor(Math.random() * characters.length)])
            .join('');
        }
        return line;
      })
      .join('<br>');

    if (charIndex >= currentLine.length) {
      lineIndex++;
      charIndex = 0;
    } else {
      charIndex++;
    }

    if (lineIndex >= lines.length) clearInterval(interval);
  }, 50);
}

// IntersectionObserver로 섹션 감지
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      animateText(entry.target.querySelector('h1'));
    }
  });
}, { threshold: 0.6 });

// 각 섹션을 감지 대상으로 등록
sections.forEach(section => observer.observe(section));

// 초기 섹션 텍스트 애니메이션 실행
animateText(sections[0].querySelector('h1'));

  </script>
</body>
</html>
